[package]
name = "tracematch"
version = "0.2.3"
edition = "2024"
authors = ["Evan Thomas <evan@evanjt.com>"]
license = "Apache-2.0"
description = "High-performance GPS route matching and activity analysis algorithms"
repository = "https://github.com/evanjt/tracematch"
readme = "README.md"
keywords = ["gps", "route", "matching", "geospatial", "fitness"]
categories = ["algorithms", "science::geo"]
publish = true
exclude = ["tests/fixtures/raw_traces"]

[lib]
name = "tracematch"
crate-type = ["rlib"]

[features]
default = ["parallel"]
parallel = ["rayon"]
synthetic = ["rand"]
# Tests that read the local personal GPX corpora. Those files exist on one
# machine and are never committed, so this is never enabled in CI.
real-corpus = []
# Tests that read a public dataset any machine can fetch. Enabling this in CI
# is a scheduling question, not a data-availability one.
public-corpus = []

[dependencies]
geo = "0.29"
rstar = "0.12"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
rand = { version = "0.8", optional = true }
web-time = "1.1"

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.14"
rand = "0.8"
proptest = "1"

[[bench]]
name = "route_matching"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "section_detection"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "iai_benchmarks"
harness = false

[[bench]]
name = "stress"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "lifecycle_scenarios"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "grouping_incremental"
harness = false
required-features = ["synthetic"]

[[test]]
name = "optimization_efficiency"
required-features = ["synthetic"]

[[test]]
name = "b1_foundation"
required-features = ["synthetic"]

[[test]]
name = "b2_identity_measure"
required-features = ["synthetic"]

[[test]]
name = "pool_incremental_parity"
required-features = ["synthetic"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = false

[profile.release-mobile]
inherits = "release"
panic = "abort"

[[example]]
name = "route_matching"
path = "examples/route_matching.rs"

[[example]]
name = "route_grouping"
path = "examples/route_grouping.rs"

[[example]]
name = "scaling_report"
path = "examples/scaling_report.rs"
required-features = ["synthetic"]

[[example]]
name = "corpus_report"
path = "examples/corpus_report.rs"

[[example]]
name = "density_grid_report"
path = "examples/density_grid_report.rs"

[[test]]
name = "grouping_sion_corpus"
required-features = ["real-corpus"]

[[test]]
name = "section_manipulation"
required-features = ["real-corpus"]

[[test]]
name = "geolife_public_corpus"
required-features = ["public-corpus"]

[[test]]
name = "full_corpus_bitwise"
required-features = ["real-corpus"]
