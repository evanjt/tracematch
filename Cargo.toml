[package]
name = "tracematch"
version = "3.0.0"
edition = "2024"
authors = ["Evan Thomas <evan@evanjt.com>"]
license = "Apache-2.0"
description = "High-performance GPS route matching and activity analysis algorithms"
repository = "https://github.com/evanjt/tracematch"
readme = "README.md"
keywords = ["gps", "route", "matching", "geospatial", "fitness"]
categories = ["algorithms", "science::geo"]
publish = true
exclude = ["tests/fixtures/raw_traces"]

[lib]
name = "tracematch"
crate-type = ["rlib"]

[features]
default = ["parallel"]
parallel = ["rayon"]
synthetic = ["rand"]
# Tests that read the local personal GPX corpora. Those files exist on one
# machine and are never committed, so this is never enabled in CI.
real-corpus = []
# Tests that read a public dataset any machine can fetch. CI fetches it into
# the gitignored geolife/ directory and runs them on every push.
public-corpus = []
# Phase timers on stderr for the lab and the drip gate. Never on by default.
profile = []

# Cargo honours a profile only at a workspace root, so this one applies when the
# crate is built standalone: its own CI, the wasm build and the web lab. Inside
# the veloq workspace the root declares the same settings and this one is
# ignored, which cargo says out loud on every build there: "profiles for the non
# root package will be ignored". That warning is the cost of pinning the
# standalone build and is not a reason to delete this. The two must agree, and
# a test in veloqrs asserts they do.
#
# codegen-units is the one that bites. At the default 16, whether rstar's
# generic AABB distance methods inline into the section fold's nearest-neighbour
# queries depends on how the partitioner happens to split the crate, and an
# unrelated edit anywhere can flip it. That is worth ~200 ms on the warm-add
# median, a third of the per-activity budget. The corpus baselines are recorded
# from this checkout and judged from the workspace one, so a profile here that
# disagrees with the root reports the build rather than the detector.
#
# opt-level is left at cargo's own release default of 3. Asking for "s" cost
# 2,297 ms against 700 ms on the same median, so the size it buys is not
# affordable on a path a sync pays per downloaded activity.
[profile.release]
lto = true
codegen-units = 1
strip = false

[dependencies]
geo = "0.29"
rstar = "0.12"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
rand = { version = "0.8", optional = true }
web-time = "1.1"

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.14"
rand = "0.8"
proptest = "1"

[[bench]]
name = "route_matching"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "section_detection"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "iai_benchmarks"
harness = false

[[bench]]
name = "stress"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "lifecycle_scenarios"
harness = false
required-features = ["synthetic"]

[[bench]]
name = "grouping_incremental"
harness = false
required-features = ["synthetic"]

[[test]]
name = "fold_corridor_convergence"
required-features = ["synthetic"]

[[test]]
name = "fold_foundation"
required-features = ["synthetic"]

[[test]]
name = "identity_measure"
required-features = ["synthetic"]

[[example]]
name = "route_matching"
path = "examples/route_matching.rs"

[[example]]
name = "route_grouping"
path = "examples/route_grouping.rs"

[[test]]
name = "grouping_city_corpus"
required-features = ["real-corpus"]

[[test]]
name = "section_manipulation"
required-features = ["real-corpus"]

[[test]]
name = "geolife_public_corpus"
required-features = ["public-corpus"]

[[test]]
name = "full_corpus_bitwise"
required-features = ["real-corpus"]

[[test]]
name = "drip_budget"
required-features = ["real-corpus"]

[[test]]
name = "fold_resume"
required-features = ["synthetic"]

[[test]]
name = "geolife_bitwise"
required-features = ["public-corpus"]
