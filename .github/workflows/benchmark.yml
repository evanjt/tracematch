name: Benchmarks

# Instruction counts move little from one commit to the next, so a weekly run
# against main's last good baseline catches a regression without charging
# every push and PR for valgrind.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Regression Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the version, and this reads it from there.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: bench

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner
        run: cargo install iai-callgrind-runner@0.14.2

      # The baseline is main's, keyed on the toolchain because a compiler bump
      # moves every count. A run id makes each saved entry unique, and the
      # prefix restores the newest one.
      - name: Restore main's baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: target/iai
          key: iai-main-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            iai-main-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      # A weekly run can outlast the cache's seven days, and with no baseline the
      # comparison passes having compared nothing. Say so where it shows.
      - name: Warn when there is no baseline
        if: steps.baseline.outputs.cache-matched-key == ''
        run: echo "::warning::No saved baseline for this toolchain, so this run compares nothing and only records one."

      # Exit code 3 when any benchmark's instruction count rises more than 5%
      # over the baseline. On main the baseline is compared and then replaced.
      # A dispatch from any other branch compares against main's and leaves it.
      - name: Run iai-callgrind benchmarks
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            cargo bench --bench iai_benchmarks -- --save-baseline=main
          else
            cargo bench --bench iai_benchmarks -- --baseline=main
          fi
        env:
          IAI_CALLGRIND_RUNNER: /home/runner/.cargo/bin/iai-callgrind-runner
          IAI_CALLGRIND_REGRESSION: Ir=5

      # Only a passing run on main becomes the next baseline, so a regression
      # cannot replace the numbers it was judged against.
      - name: Save main's baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/iai
          key: iai-main-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iai-benchmark-results
          path: target/iai/
          retention-days: 30
