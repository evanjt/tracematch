name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # `parallel` is a default feature and --all-features never turns it off,
      # so every `cfg(not(feature = "parallel"))` branch is invisible to the
      # steps above. tracematch-wasm takes the library with
      # default-features = false, which is how those branches reach a build at
      # all, and one drifted out of sync for three months unnoticed.
      - name: Check (no default features)
        run: cargo check -p tracematch --no-default-features
      - name: Test
        run: cargo test
      # fold_foundation, identity_measure and fold_resume are invisible to the
      # default lane, which enables only `parallel`. They build their corpora
      # from `tracematch::synthetic`, and only that feature compiles the module in.
      - name: Test (synthetic)
        run: cargo test --features synthetic

  # Real GPS from people who are not the author. The archive is fetched once
  # per cache lifetime and unpacked on every run; the data never lives in the
  # repository (research licence, no redistribution).
  public-corpus:
    name: Public corpus (GeoLife)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Cache the GeoLife archive
        uses: actions/cache@v4
        with:
          path: geolife/geolife.zip
          key: geolife-trajectories-1.3
      - name: Fetch and unpack GeoLife
        run: scripts/fetch_geolife.sh
      - name: Test (public corpus)
        run: cargo test --release --features public-corpus --test geolife_public_corpus --test geolife_bitwise
