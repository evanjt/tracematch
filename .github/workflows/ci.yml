name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      # The synthetic-gated targets (b1_*, b2_*, pool_incremental_parity and the
      # scenario corpora) are invisible to the default lane, which enables only
      # `parallel`.
      - name: Test (synthetic)
        run: cargo test --features synthetic

  # Real GPS from people who are not the author. The archive is fetched once
  # per cache lifetime and unpacked on every run; the data never lives in the
  # repository (research licence, no redistribution).
  public-corpus:
    name: Public corpus (GeoLife)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Cache the GeoLife archive
        uses: actions/cache@v4
        with:
          path: geolife/geolife.zip
          key: geolife-trajectories-1.3
      - name: Fetch and unpack GeoLife
        run: scripts/fetch_geolife.sh
      - name: Test (public corpus)
        run: cargo test --release --features public-corpus --test geolife_public_corpus --test geolife_bitwise
